spring:
  application:
    name: edumix

  sql:
    init:
      mode: always

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/edumix?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
    openai:
      api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        completions-path: ${AI_CHAT_PATH:/v1/chat/completions}
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

edumix:
  ai:
    model-name: ${AI_MODEL:gpt-4o-mini}
  storage:
    location: ${EDUMIX_UPLOAD_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 7200
